name: Falcon CI

on:
  pull_request:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Docker Build and run
        run: |
          docker build . -t keerthikandula/falcon-cicd-app
          docker run -d -p 8000:8000 keerthikandula/falcon-cicd-app

      - name: Test Code
        run: coverage run -m pytest tests/

      - name: Generate the report
        if: ${{ always() }}
        run: coverage report > coverage-report

      - name: Scan image
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: "keerthikandula/falcon-cicd-app"
          fail-build: false

      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - uses: actions/upload-artifact@v4
        with:
          name: vuln-report
          path: ${{ steps.scan.outputs.sarif }}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: keerthikandula/falcon-cicd-app:latest

      - name: Create issue on failure
        if: ${{ failure() }}
        run: |
          gh issue create --title "Failure on workflow: ${{ github.workflow }} - ${{ github.sha }}" --body "Failure on Job: ${{ github.job }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}